syntax = "proto3";

package raft.v1;

option java_multiple_files = true;
option java_package = "gr.uop.ds.raft.proto";


message LogEntry {
  int64  term    = 1;   // what term was created by the leader
  int64  index   = 2;   //index of term
  string command = 3;   //command that we put
}

//candidate -> for all the others
message VoteRequest {
  int64  term           = 1;   // the new term of the candidate
  string candidate_id   = 2;   // who wants to be voted
  int64  last_log_index = 3;   // index to check how much the logs has gone
  int64  last_log_term  = 4;
}

message VoteResponse {
  int64 term         = 1;
  bool  vote_granted = 2;
}

message CommandRequest {
  string command = 1; // the command that we need to give to the leader
}

message CommandResponse {
  bool success = 1; // if the command is valid
  string result = 2; // the result of the command or the error
  string leader_id = 3; // leaders id so we can print it
  int64 index = 4; // what index of the log the command was saved
}

//leader -> followers (empty entries = heartbeat)
message AppendRequest {
  int64    term           = 1;
  string   leader_id      = 2;   // so the follower sent the clients to the leader
  int64    prev_log_index = 3;   // "last committed log"
  int64    prev_log_term  = 4;
  repeated LogEntry entries = 5; // empty list = heartbeat
  int64    leader_commit  = 6;   // while is committed
}

message AppendResponse {
  int64 term    = 1;
  bool  success = 2;
}

service RaftService {
  rpc RequestVote   (VoteRequest)   returns (VoteResponse);
  rpc PreVote (VoteRequest) returns (VoteResponse);
  rpc AppendEntries (AppendRequest) returns (AppendResponse);
  rpc ClientCommand (CommandRequest) returns (CommandResponse);
}